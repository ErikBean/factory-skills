AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets GitHub Actions in one repository deploy CDK apps to this account. The role
  trusts either the repository's main branch or its pull request workflows, and
  can only assume the CDK bootstrap roles.

Parameters:
  RoleName:
    Type: String
    Description: Name of the role, such as github-deploy-my-repo or github-preview-my-repo.
  Trust:
    Type: String
    AllowedValues: [main, pull_request]
    Default: main
    Description: >-
      main for the production deploy role, which trusts only SubjectClaim.
      pull_request for the preview role, which trusts pull request workflows
      from the repository.
  SubjectClaim:
    Type: String
    Default: ""
    Description: >-
      With Trust main, the exact OIDC sub claim to trust, such as
      repo:my-org@123/my-repo@456:ref:refs/heads/main. Unused for pull_request.
  RepositoryId:
    Type: String
    AllowedPattern: "[0-9]+"
    Description: The repository's immutable numeric ID, from gh api repos/OWNER/NAME -q .id.
  RepositoryOwnerId:
    Type: String
    AllowedPattern: "[0-9]+"
    Description: The owner's immutable numeric ID, from gh api repos/OWNER/NAME -q .owner.id.
  CdkQualifier:
    Type: String
    Default: hnb659fds
    Description: The qualifier the account was bootstrapped with. hnb659fds is CDK's default.
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: false if the account already has the token.actions.githubusercontent.com provider.
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: A permissions boundary the account requires on new roles, if any.

Rules:
  MainNeedsSubjectClaim:
    RuleCondition: !Equals [!Ref Trust, main]
    Assertions:
      - Assert: !Not [!Equals [!Ref SubjectClaim, ""]]
        AssertDescription: Trust main needs the SubjectClaim of the main branch.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]
  TrustsPullRequests: !Equals [!Ref Trust, pull_request]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition: !If
              # The pull request subject names no branch, and its form for
              # repositories with immutable subject claims isn't documented, so
              # the immutable IDs pin the repository and the wildcard accepts
              # either form. Fork pull requests get no OIDC token.
              - TrustsPullRequests
              - StringEquals:
                  "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                  "token.actions.githubusercontent.com:repository_id": !Ref RepositoryId
                  "token.actions.githubusercontent.com:repository_owner_id": !Ref RepositoryOwnerId
                StringLike:
                  "token.actions.githubusercontent.com:sub": "*:pull_request"
              - StringEquals:
                  "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                  "token.actions.githubusercontent.com:repository_id": !Ref RepositoryId
                  "token.actions.githubusercontent.com:repository_owner_id": !Ref RepositoryOwnerId
                  "token.actions.githubusercontent.com:sub": !Ref SubjectClaim
      Policies:
        - PolicyName: assume-cdk-bootstrap-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-*

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
