AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets GitHub Actions in one repository deploy CDK apps to this account. The role
  trusts one OIDC subject claim and can only assume the CDK bootstrap roles.

Parameters:
  RoleName:
    Type: String
    Description: Name of the deploy role, such as github-deploy-my-repo.
  SubjectClaim:
    Type: String
    Description: >-
      The exact OIDC sub claim to trust, such as
      repo:my-org@123/my-repo@456:ref:refs/heads/main.
  CdkQualifier:
    Type: String
    Default: hnb659fds
    Description: The qualifier the account was bootstrapped with. hnb659fds is CDK's default.
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: false if the account already has the token.actions.githubusercontent.com provider.
  PermissionsBoundaryArn:
    Type: String
    Default: ""
    Description: A permissions boundary the account requires on new roles, if any.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]
  HasBoundary: !Not [!Equals [!Ref PermissionsBoundaryArn, ""]]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      PermissionsBoundary: !If [HasBoundary, !Ref PermissionsBoundaryArn, !Ref AWS::NoValue]
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "token.actions.githubusercontent.com:aud": sts.amazonaws.com
                "token.actions.githubusercontent.com:sub": !Ref SubjectClaim
      Policies:
        - PolicyName: assume-cdk-bootstrap-roles
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sts:AssumeRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/cdk-${CdkQualifier}-*

Outputs:
  DeployRoleArn:
    Value: !GetAtt DeployRole.Arn
