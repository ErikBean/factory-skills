name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npx cdk synth --quiet -c stage=prod
      - run: node scripts/check-role-boundaries.mjs

  # Warns, without failing, when the skills pinned in .agents/ are behind
  # factory-skills.
  factory-skills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: node scripts/check-factory-skills.mjs
